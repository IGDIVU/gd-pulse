<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Resize — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links"><a href="/tools">Tools</a></nav>
    <div class="header-right">
      <a href="/tools" class="btn btn-outline">← Back</a>
    </div>
  </header>

  <main>
    <div class="container" style="max-width: 600px;">
      <div class="box">
        <h2>🖼️ Image Resize Karo</h2>

        <form id="resizeForm" method="POST" action="/tools/image-resize/process" enctype="multipart/form-data">
          <label>Image Select Karo (JPG, PNG, WEBP, GIF, BMP)</label>
          <input type="file" name="image" accept="image/*" required>

          <div class="row">
            <div>
              <label>Width (px)</label>
              <input type="number" name="width" placeholder="800" min="1" required>
            </div>
            <div>
              <label>Height (px)</label>
              <input type="number" name="height" placeholder="600" min="1" required>
            </div>
          </div>

          <button type="submit" class="calc-btn" id="submitBtn">Resize & Download</button>
        </form>

        <div class="loading" id="loading">⏳ Processing... please wait</div>
        <div class="info">Image process hoke automatically download ho jayegi.</div>

        <a href="/tools" class="back">← Back to Tools</a>
      </div>
    </div>
  </main>

  <footer><p>© 2025 GD Pulse</p></footer>

  <script>
    document.getElementById("resizeForm").addEventListener("submit", function() {
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").innerText = "Processing...";
      document.getElementById("loading").style.display = "block";
    });
  </script>

</body>
</html>
