<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — GD Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #f4f6f9; color: #222; }
  header {
    background: #0f1a24; color: white; padding: 15px 30px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 22px; }
  .btn {
    background: #e74c3c; color: white; padding: 8px 20px;
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; text-decoration: none;
  }
  main { padding: 30px; }
  .section-title {
    font-size: 18px; margin-bottom: 15px; color: #0f1a24;
    border-left: 4px solid #e74c3c; padding-left: 10px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .card {
    background: white; padding: 25px 20px; border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer;
    transition: 0.2s; text-align: center; border-top: 4px solid #0f1a24;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0,0,0,0.12); }
  .card .icon { font-size: 30px; margin-bottom: 10px; }
  .card .title { font-size: 15px; font-weight: bold; color: #0f1a24; }
  .card .desc { font-size: 12px; color: #777; margin-top: 5px; }
</style>
</head>
<body>

  <header>
    <h1>🛠️ Admin Dashboard</h1>
    <a href="/logout" class="btn">Logout</a>
  </header>

  <main>
    <h2 class="section-title">Business Modules</h2>
    <div class="grid">
      <div class="card" onclick="alert('Retail module coming soon')">
        <div class="icon">🏪</div><div class="title">Retail Store</div>
        <div class="desc">Item, Purchase, Sale, Stock</div>
      </div>
      <div class="card" onclick="alert('Restaurant module coming soon')">
        <div class="icon">🍽️</div><div class="title">Restaurant / Hotel</div>
        <div class="desc">Indent, Store, GRN</div>
      </div>
      <div class="card" onclick="alert('Sand Business module coming soon')">
        <div class="icon">🚛</div><div class="title">Sand Business</div>
        <div class="desc">Stock, Truck, Challan, Billing</div>
      </div>
    </div>
  </main>

</body>
</html>
