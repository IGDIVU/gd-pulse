<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — GD Pulse</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Admin-specific override */
  header { background: rgba(20, 5, 30, 0.75); }
  .section-title { border-left-color: var(--accent); }
  .section-title::after { background: linear-gradient(90deg, var(--accent), transparent); }
  .card { border-top: 3px solid var(--accent); }
  .card:hover { border-color: var(--accent); box-shadow: 0 20px 50px rgba(236, 72, 153, 0.25), 0 0 30px rgba(236, 72, 153, 0.3); }
  .card::before { background: radial-gradient(circle at 50% 0%, rgba(236, 72, 153, 0.25), transparent 70%); }
</style>
</head>
<body>

  <header>
    <h1>🛠️ Admin Dashboard</h1>
    <a href="/logout" class="btn">Logout</a>
  </header>

  <main>
    <div class="welcome">
      <h1>Admin Panel</h1>
      <p>Business modules aur projects yahan se manage karo.</p>
    </div>

    <h2 class="section-title">Business Modules</h2>
    <div class="grid">
      <div class="card tilt" onclick="alert('Retail module coming soon')">
        <div class="icon">🏪</div><div class="title">Retail Store</div>
        <div class="desc">Item, Purchase, Sale, Stock</div>
      </div>
      <div class="card tilt" onclick="alert('Restaurant module coming soon')">
        <div class="icon">🍽️</div><div class="title">Restaurant / Hotel</div>
        <div class="desc">Indent, Store, GRN</div>
      </div>
      <div class="card tilt" onclick="alert('Sand Business module coming soon')">
        <div class="icon">🚛</div><div class="title">Sand Business</div>
        <div class="desc">Stock, Truck, Challan, Billing</div>
      </div>
    </div>
  </main>

  <script>
    document.querySelectorAll(".tilt").forEach(card => {
      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -10;
        const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 10;
        card.style.transform = `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px) scale(1.04)`;
      });
      card.addEventListener("mouseleave", () => { card.style.transform = ""; });
    });
  </script>

</body>
</html>
