<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links"><a href="/tools">Tools</a></nav>
    <div class="header-right">
      <a href="/tools" class="btn btn-outline">← Back</a>
    </div>
  </header>

  <main>
    <div class="container" style="max-width: 600px;">
      <div class="box">
        <h2>📱 QR Code Generator</h2>

        <form id="qrForm" method="POST" action="/tools/qr-code/process">
          <label>Text ya URL daalo</label>
          <input type="text" name="text" placeholder="https://example.com ya koi bhi text" required>

          <label>Size (px)</label>
          <select name="size">
            <option value="200">200 x 200</option>
            <option value="300" selected>300 x 300</option>
            <option value="400">400 x 400</option>
            <option value="500">500 x 500</option>
          </select>

          <button type="submit" class="calc-btn" id="submitBtn">Generate & Download QR</button>
        </form>

        <div class="loading" id="loading">⏳ QR ban raha hai... please wait</div>

        <div class="info">
          💡 Tip: QR code me website URL, text, phone number, ya WiFi details daal sakte ho. Image automatically download ho jayegi.
        </div>

        <a href="/tools" class="back">← Back to Tools</a>
      </div>
    </div>
  </main>

  <footer><p>© 2025 GD Pulse</p></footer>

  <script>
    document.getElementById("qrForm").addEventListener("submit", function() {
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").innerText = "Generating...";
      document.getElementById("loading").style.display = "block";
    });
  </script>

</body>
</html>
