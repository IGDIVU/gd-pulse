<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Tools — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links"><a href="/tools">Tools</a></nav>
    <div class="header-right">
      <a href="/tools" class="btn btn-outline">← Back</a>
    </div>
  </header>

  <main>
    <div class="container" style="max-width: 800px;">
      <div class="box">
        <h2>🔤 Text ke Saath Kaam Karo</h2>

        <textarea id="text" placeholder="Yahan apna text likho ya paste karo..." style="min-height:180px;" oninput="updateStats()"></textarea>

        <div class="stats-grid">
          <div class="stat-box"><div class="label">Words</div><div class="value" id="s-words">0</div></div>
          <div class="stat-box"><div class="label">Chars</div><div class="value" id="s-chars">0</div></div>
          <div class="stat-box"><div class="label">No Space</div><div class="value" id="s-nospace">0</div></div>
          <div class="stat-box"><div class="label">Lines</div><div class="value" id="s-lines">0</div></div>
        </div>

        <div class="btn-grid">
          <button class="action-btn" onclick="toUpper()">UPPERCASE</button>
          <button class="action-btn" onclick="toLower()">lowercase</button>
          <button class="action-btn" onclick="toTitle()">Title Case</button>
          <button class="action-btn" onclick="toSentence()">Sentence case</button>
          <button class="action-btn" onclick="reverseText()">Reverse Text</button>
          <button class="action-btn" onclick="removeSpaces()">Remove Extra Spaces</button>
          <button class="action-btn" onclick="removeLineBreaks()">Remove Line Breaks</button>
          <button class="action-btn" onclick="copyText()">📋 Copy</button>
          <button class="action-btn" onclick="clearText()">🗑️ Clear</button>
          <button class="action-btn" onclick="downloadText()">⬇️ Download .txt</button>
        </div>

        <a href="/tools" class="back">← Back to Tools</a>
      </div>
    </div>
  </main>

  <footer><p>© 2025 GD Pulse</p></footer>

  <script>
    const txt = document.getElementById("text");
    function updateStats() {
      const t = txt.value;
      const words = t.trim() ? t.trim().split(/\s+/).length : 0;
      document.getElementById("s-words").innerText = words;
      document.getElementById("s-chars").innerText = t.length;
      document.getElementById("s-nospace").innerText = t.replace(/\s/g, "").length;
      document.getElementById("s-lines").innerText = t ? t.split("\n").length : 0;
    }
    function toUpper() { txt.value = txt.value.toUpperCase(); updateStats(); }
    function toLower() { txt.value = txt.value.toLowerCase(); updateStats(); }
    function toTitle() { txt.value = txt.value.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase()); updateStats(); }
    function toSentence() { txt.value = txt.value.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase()); updateStats(); }
    function reverseText() { txt.value = txt.value.split("").reverse().join(""); updateStats(); }
    function removeSpaces() { txt.value = txt.value.replace(/[ \t]+/g, " ").trim(); updateStats(); }
    function removeLineBreaks() { txt.value = txt.value.replace(/\n+/g, " ").trim(); updateStats(); }
    function clearText() { if (confirm("Text clear karna hai?")) { txt.value = ""; updateStats(); } }
    function copyText() { if (!txt.value) { alert("Kuch text toh likho"); return; } txt.select(); document.execCommand("copy"); alert("Copy ho gaya! ✅"); }
    function downloadText() {
      if (!txt.value) { alert("Kuch text toh likho"); return; }
      const blob = new Blob([txt.value], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "gd-pulse-text.txt";
      a.click();
    }
  </script>

</body>
</html>
