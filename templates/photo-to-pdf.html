<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo to PDF — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links"><a href="/tools">Tools</a></nav>
    <div class="header-right">
      <a href="/tools" class="btn btn-outline">← Back</a>
    </div>
  </header>

  <main>
    <div class="container" style="max-width: 650px;">
      <div class="box">
        <h2>📄 Images ko PDF me Convert Karo</h2>

        <form id="pdfForm" method="POST" action="/tools/photo-to-pdf/process" enctype="multipart/form-data">
          <label>Images Select Karo (ek se zyada select kar sakte ho)</label>
          <input type="file" name="images" accept="image/*" multiple required>

          <button type="submit" class="calc-btn" id="submitBtn">Convert to PDF</button>
        </form>

        <div class="loading" id="loading">⏳ PDF ban rahi hai... please wait</div>

        <div class="info">
          💡 Tip: Multiple images select karne ke liye <b>Ctrl</b> (Windows) ya <b>Cmd</b> (Mac) dabaye rakho aur click karo. Ya ek saath drag karo.
        </div>

        <a href="/tools" class="back">← Back to Tools</a>
      </div>
    </div>
  </main>

  <footer><p>© 2025 GD Pulse</p></footer>

  <script>
    document.getElementById("pdfForm").addEventListener("submit", function() {
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").innerText = "Processing...";
      document.getElementById("loading").style.display = "block";
    });
  </script>

</body>
</html>
