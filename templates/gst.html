<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST Calculator — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links">
      <a href="/tools">Tools</a>
    </nav>
    <div class="header-right">
      <a href="/tools" class="btn btn-outline">← Back</a>
    </div>
  </header>

  <main>
    <div class="container" style="max-width: 600px;">
      <div class="box">
        <h2>🧮 GST Calculate Karo</h2>

        <label>Calculation Type</label>
        <div style="display:flex; gap:20px; margin-bottom:18px; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:6px; margin:0; cursor:pointer;">
            <input type="radio" name="type" value="exclusive" checked style="width:auto; margin:0;"> GST Add (Exclusive)
          </label>
          <label style="display:flex; align-items:center; gap:6px; margin:0; cursor:pointer;">
            <input type="radio" name="type" value="inclusive" style="width:auto; margin:0;"> GST Remove (Inclusive)
          </label>
        </div>

        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="Jaise: 10000" min="0" step="0.01">

        <label>GST Rate</label>
        <select id="rate">
          <option value="5">5%</option>
          <option value="12">12%</option>
          <option value="18" selected>18%</option>
          <option value="28">28%</option>
        </select>

        <button class="calc-btn" onclick="calculateGST()">Calculate</button>

        <div id="result" class="result" style="display:none;">
          <div class="result-row"><span>Base Amount</span><span id="r-base">₹0</span></div>
          <div class="result-row"><span>GST Amount</span><span id="r-gst">₹0</span></div>
          <div class="result-row"><span>Total Amount</span><span id="r-total">₹0</span></div>
        </div>

        <a href="/tools" class="back">← Back to Tools</a>
      </div>
    </div>
  </main>

  <footer><p>© 2025 GD Pulse</p></footer>

  <script>
    function calculateGST() {
      const amount = parseFloat(document.getElementById("amount").value);
      const rate = parseFloat(document.getElementById("rate").value);
      const type = document.querySelector('input[name="type"]:checked').value;

      if (isNaN(amount) || amount <= 0) { alert("Sahi amount daalo"); return; }

      let base, gst, total;
      if (type === "exclusive") {
        base = amount;
        gst = (amount * rate) / 100;
        total = base + gst;
      } else {
        total = amount;
        base = (amount * 100) / (100 + rate);
        gst = total - base;
      }

      document.getElementById("r-base").innerText = "₹" + base.toFixed(2);
      document.getElementById("r-gst").innerText = "₹" + gst.toFixed(2);
      document.getElementById("r-total").innerText = "₹" + total.toFixed(2);
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
