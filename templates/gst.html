<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST Calculator — GD Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #f4f6f9; color: #222; }
  header {
    background: #1e2a38; color: white; padding: 15px 30px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 20px; }
  .btn {
    background: #00b894; color: white; padding: 8px 20px;
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; text-decoration: none;
  }
  .btn:hover { background: #019875; }
  .btn-outline { background: transparent; border: 1px solid #00b894; color: #00b894; }
  main { padding: 30px; max-width: 600px; margin: 0 auto; }
  .box {
    background: white; padding: 30px; border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  h2 { color: #1e2a38; margin-bottom: 20px; font-size: 22px; }
  label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 12px; margin-bottom: 18px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 15px;
  }
  input:focus, select:focus { outline: none; border-color: #00b894; }
  .radio-group { display: flex; gap: 20px; margin-bottom: 18px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; margin: 0; cursor: pointer; }
  .radio-group input { width: auto; margin: 0; }
  .calc-btn {
    width: 100%; padding: 14px; background: #00b894; color: white;
    border: none; border-radius: 6px; font-size: 16px; cursor: pointer;
    font-weight: bold;
  }
  .calc-btn:hover { background: #019875; }
  .result {
    margin-top: 25px; padding: 20px; background: #f0fdf9;
    border-left: 4px solid #00b894; border-radius: 8px;
  }
  .result-row {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px dashed #cde9e0; font-size: 15px;
  }
  .result-row:last-child { border-bottom: none; font-weight: bold; font-size: 17px; color: #019875; }
  .result-row span:last-child { font-weight: bold; }
  .back { display: inline-block; margin-top: 20px; color: #1e2a38; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>

  <header>
    <h1>🧮 GST Calculator</h1>
    <a href="/" class="btn btn-outline" style="color:white; border-color:white;">← Dashboard</a>
  </header>

  <main>
    <div class="box">
      <h2>GST Calculate Karo</h2>

      <label>Calculation Type</label>
      <div class="radio-group">
        <label><input type="radio" name="type" value="exclusive" checked> GST Add (Exclusive)</label>
        <label><input type="radio" name="type" value="inclusive"> GST Remove (Inclusive)</label>
      </div>

      <label>Amount (₹)</label>
      <input type="number" id="amount" placeholder="Jaise: 10000" min="0" step="0.01">

      <label>GST Rate</label>
      <select id="rate">
        <option value="5">5%</option>
        <option value="12">12%</option>
        <option value="18" selected>18%</option>
        <option value="28">28%</option>
      </select>

      <button class="calc-btn" onclick="calculateGST()">Calculate</button>

      <div id="result" class="result" style="display:none;">
        <div class="result-row"><span>Base Amount</span><span id="r-base">₹0</span></div>
        <div class="result-row"><span>GST Amount</span><span id="r-gst">₹0</span></div>
        <div class="result-row"><span>Total Amount</span><span id="r-total">₹0</span></div>
      </div>

      <a href="/" class="back">← Back to Dashboard</a>
    </div>
  </main>

  <script>
    function calculateGST() {
      const amount = parseFloat(document.getElementById("amount").value);
      const rate = parseFloat(document.getElementById("rate").value);
      const type = document.querySelector('input[name="type"]:checked').value;

      if (isNaN(amount) || amount <= 0) {
        alert("Sahi amount daalo");
        return;
      }

      let base, gst, total;

      if (type === "exclusive") {
        base = amount;
        gst = (amount * rate) / 100;
        total = base + gst;
      } else {
        total = amount;
        base = (amount * 100) / (100 + rate);
        gst = total - base;
      }

      document.getElementById("r-base").innerText = "₹" + base.toFixed(2);
      document.getElementById("r-gst").innerText = "₹" + gst.toFixed(2);
      document.getElementById("r-total").innerText = "₹" + total.toFixed(2);
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
