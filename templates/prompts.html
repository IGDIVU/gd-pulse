<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompts — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  .tab-bar {
    display: flex;
    gap: 8px;
    margin: 30px 0 30px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn:hover { color: var(--primary); }
  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .tab-btn svg { width: 18px; height: 18px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeInUp 0.5s ease; }

  .section-label {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--primary);
    margin: 30px 0 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--primary), transparent);
  }

  .prompt-search {
    max-width: 400px;
    margin-bottom: 20px;
    position: relative;
  }
  .prompt-search input { padding-left: 42px; margin-bottom: 0; }
  .prompt-search .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--text-dim);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 9999;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 32px;
    max-width: 900px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    position: relative;
    animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--glass);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
  }
  .modal-close:hover { background: var(--danger); color: white; transform: rotate(90deg); }
  .modal-close svg { width: 18px; height: 18px; }
  .modal-box h2 { margin-bottom: 8px; color: var(--text); font-size: 24px; font-weight: 800; }
  .modal-box .modal-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
  .prompt-step {
    background: rgba(139, 92, 246, 0.05);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius-sm);
    padding: 20px;
    margin-bottom: 18px;
  }
  .step-label {
    display: inline-block;
    background: var(--primary);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .prompt-step h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .prompt-step pre {
    background: var(--bg);
    color: var(--text);
    padding: 14px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'Consolas', 'Monaco', monospace;
    max-height: 200px;
    overflow-y: auto;
    border: 1px solid var(--border);
  }
  .copy-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .copy-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139,92,246,0.4); }
  .copy-btn.copied { background: linear-gradient(135deg, var(--success), #059669); }
  .copy-btn svg { width: 14px; height: 14px; }

  .tool-icon {
    width: 26px;
    height: 26px;
    color: var(--primary);
    margin-bottom: 12px;
    transition: all 0.4s;
  }
  .tool-card:hover .tool-icon { color: white; transform: translateY(-4px) scale(1.15); }
</style>
</head>
<body>

  <div class="parallax-orb" style="top: 10%; left: 5%;"></div>
  <div class="parallax-orb" style="bottom: 10%; right: 5%;"></div>

  <header>

  <footer><p>© 2025 GD Pulse — Prompts Library</p></footer>

  <script src="/static/icons.js"></script>

  <script>

Clip 2 (Build): [Context/problem] + text
Clip 3 (Reveal): [Solution/product] + text

      restaurant: {
        title: "Restaurant Promo Video",
        sub: "5 clips × 6 sec · Pre + Master + Agent",

            label: "Step 1 — Pre-Production",
            name: "Concept & Menu Focus",

Cuisine: [TYPE]
Signature dishes: [DISHES]

    // ============================================
    // RENDER PROMPTS
    // ============================================
    const PROMPT_ICONS = {
      logo: "design", insta: "content", product: "image", food: "restaurant",
      thumb: "video", poster: "design", packaging: "assets",
      cinematic30: "video", reel15: "content", restaurant: "restaurant", productAd: "retail",
      videoEditor: "video", scriptWriter: "text", strategist: "analytics", brandDesigner: "design"
    };

    function makeCard(key, data, tagText) {
      const icon = PROMPT_ICONS[key] || "sparkle";
      return `
        <div class="card reveal" onclick="openPrompt('${key}')" data-search="${data.title.toLowerCase()} ${data.sub.toLowerCase()}">
          <span class="tool-icon" data-icon="${icon}"></span>
          <div class="title">${data.title}</div>
          <div class="desc">${data.sub}</div>
          <span class="tag">${tagText}</span>
        </div>
      `;
    }

    function renderAll() {
      const single = [], multi = [], system = [];
      Object.entries(PROMPTS).forEach(([key, data]) => {
        if (data.cat === "single") single.push(makeCard(key, data, "Copy →"));
        else if (data.cat === "multi") multi.push(makeCard(key, data, "Workflow →"));
        else system.push(makeCard(key, data, "Copy →"));
      });

      // Tab: All
      document.getElementById("singleGrid").innerHTML = single.join("");
      document.getElementById("multiGrid").innerHTML = multi.join("");
      document.getElementById("systemGrid").innerHTML = system.join("");

      // Tab: Single
      document.getElementById("singleGrid2").innerHTML = single.join("");
      // Tab: Multi
      document.getElementById("multiGrid2").innerHTML = multi.join("");
      // Tab: System
      document.getElementById("systemGrid2").innerHTML = system.join("");

      // Re-render icons + reveal
      if (window.renderIcons) window.renderIcons();
      document.querySelectorAll(".reveal").forEach(el => {
        setTimeout(() => el.classList.add("active"), 50);
      });
    }

    // ============================================
    // TAB SWITCHING
    // ============================================
    function switchTab(tab, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");
    }

    // ============================================
    // MODAL
    // ============================================
    function openPrompt(key) {
      const data = PROMPTS[key];
      if (!data) return;
      let html = `<h2>${data.title}</h2><p class="modal-sub">${data.sub}</p>`;
      data.steps.forEach((step, i) => {
        html += `
          <div class="prompt-step">
            <span class="step-label">${step.label}</span>
            <h3>${step.name}</h3>
            <pre id="promptText-${i}">${step.text}</pre>
            <button class="copy-btn" onclick="copyPrompt(${i}, this)">
              <span data-icon="copy"></span> Copy Prompt
            </button>
          </div>`;
      });
      document.getElementById("modalContent").innerHTML = html;
      document.getElementById("promptModal").classList.add("active");
      document.body.style.overflow = "hidden";
      if (window.renderIcons) window.renderIcons();
    }

    function closeModal() {
      document.getElementById("promptModal").classList.remove("active");
      document.body.style.overflow = "";
    }

    function closeModalOnBg(e) {
      if (e.target.id === "promptModal") closeModal();
    }

    function copyPrompt(index, btn) {
      const text = document.getElementById(`promptText-${index}`).innerText;
      navigator.clipboard.writeText(text).then(() => {
        btn.innerHTML = '<span data-icon="check"></span> Copied!';
        btn.classList.add("copied");
        if (window.renderIcons) window.renderIcons();
        setTimeout(() => {
          btn.innerHTML = '<span data-icon="copy"></span> Copy Prompt';
          btn.classList.remove("copied");
          if (window.renderIcons) window.renderIcons();
        }, 2000);
      });
    }

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    // ============================================
    // SEARCH
    // ============================================
    function filterPrompts() {
      const query = document.getElementById("promptSearch").value.toLowerCase().trim();
      document.querySelectorAll("[data-search]").forEach(card => {
        const text = card.getAttribute("data-search");
        card.style.display = (query === "" || text.includes(query)) ? "" : "none";
      });
    }

    // INIT
    document.addEventListener("DOMContentLoaded", () => {
      renderAll();
      if (window.renderIcons) window.renderIcons();
    });
    setTimeout(() => {
      renderAll();
      if (window.renderIcons) window.renderIcons();
    }, 100);
  </script>

</body>
</html>
