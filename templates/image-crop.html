<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Cropper — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links"><a href="/tools">Tools</a></nav>
    <div class="header-right">
      <a href="/tools" class="btn btn-outline">← Back</a>
    </div>
  </header>

  <main>
    <div class="container" style="max-width: 750px;">
      <div class="box">
        <h2>✂️ Image Crop Karo</h2>

        <form id="cropForm" method="POST" action="/tools/image-crop/process" enctype="multipart/form-data">
          <label>Image Select Karo</label>
          <input type="file" name="image" id="imageInput" accept="image/*" required onchange="previewImage(this)">

          <img id="preview" alt="preview" style="max-width:100%; margin-top:15px; border-radius:10px; display:none; border: 2px solid var(--primary-light);">

          <div class="row">
            <div>
              <label>X (Left se px)</label>
              <input type="number" name="x" value="0" min="0">
            </div>
            <div>
              <label>Y (Top se px)</label>
              <input type="number" name="y" value="0" min="0">
            </div>
          </div>

          <div class="row">
            <div>
              <label>Width (px)</label>
              <input type="number" name="width" placeholder="500" min="1" required>
            </div>
            <div>
              <label>Height (px)</label>
              <input type="number" name="height" placeholder="500" min="1" required>
            </div>
          </div>

          <div class="info">💡 Tip: Original image ka size dekhne ke liye image pe hover karo. X=0, Y=0 top-left corner hai.</div>

          <button type="submit" class="calc-btn" id="submitBtn" style="margin-top: 15px;">Crop & Download</button>
        </form>

        <div class="loading" id="loading">⏳ Cropping... please wait</div>

        <a href="/tools" class="back">← Back to Tools</a>
      </div>
    </div>
  </main>

  <footer><p>© 2025 GD Pulse</p></footer>

  <script>
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById("preview");
          img.src = e.target.result;
          img.style.display = "block";
          img.onload = function() {
            img.title = `Original: ${img.naturalWidth} x ${img.naturalHeight}px`;
          };
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    document.getElementById("cropForm").addEventListener("submit", function() {
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").innerText = "Processing...";
      document.getElementById("loading").style.display = "block";
    });
  </script>

</body>
</html>
