<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Cropper — GD Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0a0f1a; color: #e6edf5; min-height: 100vh; }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(circle at 20% 30%, rgba(0,184,148,0.12), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(108,92,231,0.12), transparent 40%);
    z-index: -1;
  }
  header {
    background: rgba(15,23,36,0.75); backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: white; padding: 16px 30px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 20px; }
  .btn {
    background: linear-gradient(135deg, #00b894, #019875); color: white;
    padding: 10px 22px; border: none; border-radius: 30px;
    cursor: pointer; font-size: 14px; font-weight: bold;
    text-decoration: none; box-shadow: 0 4px 14px rgba(0,184,148,0.35);
  }
  .btn:hover { transform: translateY(-2px); }
  main { padding: 30px; max-width: 750px; margin: 0 auto; }
  .box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 30px; border-radius: 18px;
    backdrop-filter: blur(12px);
  }
  h2 { margin-bottom: 22px; font-size: 22px; }
  label { display: block; font-size: 14px; color: #a0aec0; margin-bottom: 8px; margin-top: 15px; }
  input[type="file"] {
    width: 100%; padding: 12px; margin-bottom: 10px;
    border: 1px dashed rgba(0,184,148,0.5);
    border-radius: 10px; background: rgba(0,184,148,0.05);
    color: #e6edf5; font-size: 14px; cursor: pointer;
  }
  input[type="number"] {
    width: 100%; padding: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; background: rgba(255,255,255,0.05);
    color: #e6edf5; font-size: 15px;
  }
  input[type="number"]:focus { outline: none; border-color: #00b894; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .calc-btn {
    width: 100%; padding: 15px; margin-top: 20px;
    background: linear-gradient(135deg, #00b894, #019875);
    color: white; border: none; border-radius: 10px;
    font-size: 16px; cursor: pointer; font-weight: bold;
    box-shadow: 0 4px 14px rgba(0,184,148,0.35);
  }
  .calc-btn:hover { transform: translateY(-2px); }
  .calc-btn:disabled { background: #555; cursor: not-allowed; box-shadow: none; }
  .back { display: inline-block; margin-top: 20px; color: #a0aec0; text-decoration: none; font-size: 14px; }
  .back:hover { color: #00b894; }
  .info { font-size: 12px; color: #7d8a9c; margin-top: 8px; line-height: 1.5; }
  #preview {
    max-width: 100%; margin-top: 15px; border-radius: 10px;
    display: none; border: 2px solid rgba(0,184,148,0.3);
  }
  .loading { text-align: center; color: #00b894; margin-top: 15px; display: none; }
</style>
</head>
<body>
  <header>
    <h1>✂️ Image Cropper</h1>
    <a href="/" class="btn">← Dashboard</a>
  </header>
  <main>
    <div class="box">
      <h2>Image Crop Karo</h2>
      <form id="cropForm" method="POST" action="/tools/image-crop/process" enctype="multipart/form-data">
        <label>Image Select Karo</label>
        <input type="file" name="image" id="imageInput" accept="image/*" required onchange="previewImage(this)">

        <img id="preview" alt="preview">

        <div class="row">
          <div>
            <label>X (Left se px)</label>
            <input type="number" name="x" value="0" min="0">
          </div>
          <div>
            <label>Y (Top se px)</label>
            <input type="number" name="y" value="0" min="0">
          </div>
        </div>
        <div class="row">
          <div>
            <label>Width (px)</label>
            <input type="number" name="width" placeholder="500" min="1" required>
          </div>
          <div>
            <label>Height (px)</label>
            <input type="number" name="height" placeholder="500" min="1" required>
          </div>
        </div>

        <div class="info">💡 Tip: Original image ka size dekhne ke liye image pe hover karo. X=0, Y=0 top-left corner hai.</div>

        <button type="submit" class="calc-btn" id="submitBtn">Crop & Download</button>
      </form>
      <div class="loading" id="loading">⏳ Cropping... please wait</div>
      <a href="/" class="back">← Back to Dashboard</a>
    </div>
  </main>
  <script>
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById("preview");
          img.src = e.target.result;
          img.style.display = "block";
          img.onload = function() {
            img.title = `Original: ${img.naturalWidth} x ${img.naturalHeight}px`;
          };
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    document.getElementById("cropForm").addEventListener("submit", function() {
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").innerText = "Processing...";
      document.getElementById("loading").style.display = "block";
    });
  </script>
</body>
</html>
