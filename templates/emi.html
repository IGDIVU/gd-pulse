<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Calculator — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links"><a href="/tools">Tools</a></nav>
    <div class="header-right">
      <a href="/tools" class="btn btn-outline">← Back</a>
    </div>
  </header>

  <main>
    <div class="container" style="max-width: 650px;">
      <div class="box">
        <h2>💰 Loan EMI Calculate Karo</h2>

        <label>Loan Amount (₹)</label>
        <input type="number" id="principal" placeholder="Jaise: 500000" min="0">

        <label>Interest Rate (% per year)</label>
        <input type="number" id="rate" placeholder="Jaise: 8.5" min="0" step="0.01">

        <label>Loan Tenure</label>
        <input type="number" id="tenure" placeholder="Jaise: 5" min="1">
        <select id="tenureType">
          <option value="months">Months</option>
          <option value="years" selected>Years</option>
        </select>

        <button class="calc-btn" onclick="calculateEMI()">Calculate EMI</button>

        <div id="result" class="result" style="display:none;">
          <div class="result-row"><span>Monthly EMI</span><span id="r-emi">₹0</span></div>
          <div class="result-row"><span>Total Interest</span><span id="r-interest">₹0</span></div>
          <div class="result-row"><span>Total Payment</span><span id="r-total">₹0</span></div>
        </div>

        <a href="/tools" class="back">← Back to Tools</a>
      </div>
    </div>
  </main>

  <footer><p>© 2025 GD Pulse</p></footer>

  <script>
    function calculateEMI() {
      const principal = parseFloat(document.getElementById("principal").value);
      const annualRate = parseFloat(document.getElementById("rate").value);
      let tenure = parseFloat(document.getElementById("tenure").value);
      const tenureType = document.getElementById("tenureType").value;

      if (isNaN(principal) || principal <= 0 || isNaN(annualRate) || annualRate < 0 || isNaN(tenure) || tenure <= 0) {
        alert("Sahi values daalo"); return;
      }

      let months = tenureType === "years" ? tenure * 12 : tenure;
      const monthlyRate = annualRate / 12 / 100;
      let emi, totalPayment, totalInterest;

      if (monthlyRate === 0) {
        emi = principal / months;
        totalPayment = principal;
        totalInterest = 0;
      } else {
        const factor = Math.pow(1 + monthlyRate, months);
        emi = (principal * monthlyRate * factor) / (factor - 1);
        totalPayment = emi * months;
        totalInterest = totalPayment - principal;
      }

      document.getElementById("r-emi").innerText = "₹" + emi.toFixed(2);
      document.getElementById("r-interest").innerText = "₹" + totalInterest.toFixed(2);
      document.getElementById("r-total").innerText = "₹" + totalPayment.toFixed(2);
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
