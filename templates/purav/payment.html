<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Payment — Purav Carting</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  .pc-nav { background: linear-gradient(135deg, #1e3a8a 0%, #ea580c 100%); padding: 0 20px; display: flex; align-items: center; gap: 4px; overflow-x: auto; box-shadow: 0 4px 20px rgba(30,58,138,0.3); position: sticky; top: 70px; z-index: 90; white-space: nowrap; }
  .pc-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 14px 16px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border-bottom: 3px solid transparent; }
  .pc-nav a:hover, .pc-nav a.active { color: white; background: rgba(255,255,255,0.1); }
  .pc-nav a.active { border-bottom-color: white; }
  .pc-nav a [data-icon] { width: 15px; height: 15px; }

  .page-head { padding: 30px 40px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
  .page-head h1 { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -1px; display: flex; align-items: center; gap: 12px; }
  .page-head h1 [data-icon] { width: 32px; height: 32px; color: #1e3a8a; }

  .btn-pc { background: linear-gradient(135deg, #1e3a8a, #ea580c); color: white; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 8px 20px rgba(30,58,138,0.3); }
  .btn-pc [data-icon] { width: 16px; height: 16px; }

  .form-wrap { max-width: 750px; margin: 0 auto 40px; padding: 0 40px; }
  .card { background: var(--card); border: 2px solid #1e3a8a; border-radius: 18px; padding: 32px; box-shadow: 0 15px 40px rgba(30,58,138,0.15); }
  .card h2 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }
  .card h2 [data-icon] { width: 22px; height: 22px; color: #1e3a8a; }

  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  label { display: block; font-size: 12px; color: var(--text-dim); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select, textarea { width: 100%; padding: 12px 14px; margin: 0; border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #1e3a8a; }

  .outstanding-box { background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(234,88,12,0.1)); border: 2px solid #ea580c; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .outstanding-box .ob-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; color: #ea580c; margin-bottom: 6px; }
  .outstanding-box .ob-value { font-size: 32px; font-weight: 900; color: #ea580c; letter-spacing: -1px; }

  .form-actions { display: flex; gap: 12px; margin-top: 24px; }
  .form-actions button, .form-actions a { flex: 1; padding: 15px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; border: none; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .form-actions .btn-cancel { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
  .form-actions .btn-save { background: linear-gradient(135deg, #1e3a8a, #ea580c); color: white; box-shadow: 0 8px 20px rgba(30,58,138,0.3); }

  @media (max-width: 700px) {
    .page-head, .form-wrap { padding-left: 20px; padding-right: 20px; }
    .form-grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links"><a href="/purav/carting" class="active">Purav Carting</a></nav>
    <div class="header-right">
      <button class="theme-toggle" onclick="toggleTheme(event)"></button>
      <a href="#" onclick="confirmLogout(event)" class="avatar" title="{{ name }}">{{ name[0]|upper }}</a>
    </div>
  </header>

  <nav class="pc-nav">
    <a href="/purav/carting"><span data-icon="grid"></span> Dashboard</a>
    <a href="/purav/carting/challan"><span data-icon="retail"></span> Challan</a>
    <a href="/purav/carting/invoice"><span data-icon="gst"></span> Invoice</a>
    <a href="/purav/carting/payment" class="active"><span data-icon="gst"></span> Payment</a>
    <a href="/purav/carting/payment/list"><span data-icon="analytics"></span> Payment List</a>
    <a href="/purav/carting/ledger"><span data-icon="analytics"></span> Ledger</a>
  </nav>

  <div class="page-head">
    <h1><span data-icon="gst"></span> New Payment Received</h1>
    <a href="/purav/carting/payment/list" class="btn-pc"><span data-icon="grid"></span> Payment List</a>
  </div>

  <div class="form-wrap">
    <div class="card">
      <h2><span data-icon="gst"></span> Customer Payment Entry</h2>
      <form method="POST" action="/purav/carting/payment/add" id="payForm">
        <label>Customer</label>
        <select name="customer_id" id="custSelect" onchange="updateOutstanding()" required>
          <option value="">-- Select Customer --</option>
          {% for c in customers %}
          <option value="{{ c.id }}" data-outstanding="{{ c.outstanding }}">{{ c.name }} {% if c.outstanding > 0 %}(₹{{ "{:,.0f}".format(c.outstanding) }} pending){% endif %}</option>
          {% endfor %}
        </select>

        <div class="outstanding-box" id="outBox" style="display:none;">
          <div class="ob-label">Current Outstanding</div>
          <div class="ob-value" id="outValue">₹0</div>
        </div>

        <div class="form-grid-2">
          <div><label>Date *</label><input type="date" name="date" value="{{ today }}" required></div>
          <div><label>Amount (₹) *</label><input type="number" name="amount" value="0" step="0.01" min="0" required></div>
        </div>

        <div class="form-grid-2">
          <div>
            <label>Payment Mode</label>
            <select name="mode">
              <option value="Cash">Cash</option>
              <option value="Cheque">Cheque</option>
              <option value="UPI">UPI</option>
              <option value="RTGS/NEFT">RTGS/NEFT</option>
              <option value="Online">Online</option>
            </select>
          </div>
          <div><label>Reference No</label><input type="text" name="ref_no" placeholder="Cheque/UTR number"></div>
        </div>

        <div class="form-grid-2">
          <div><label>Bank Name</label><input type="text" name="bank" placeholder="Optional"></div>
          <div><label>Notes</label><input type="text" name="notes" placeholder="Optional"></div>
        </div>

        <div class="form-actions">
          <a href="/purav/carting" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-save"><span data-icon="check"></span> Save Payment</button>
        </div>
      </form>
    </div>
  </div>

  <footer><p>© 2025 GD Pulse — Purav Carting</p></footer>

  <script src="/static/icons.js"></script>
  <script>
    function updateOutstanding() {
      const sel = document.getElementById('custSelect');
      const opt = sel.options[sel.selectedIndex];
      const out = parseFloat(opt.getAttribute('data-outstanding')) || 0;
      const box = document.getElementById('outBox');
      if (sel.value && out > 0) {
        document.getElementById('outValue').innerText = '₹' + out.toLocaleString('en-IN', {maximumFractionDigits: 2});
        box.style.display = 'block';
      } else {
        box.style.display = 'none';
      }
    }
    document.addEventListener("DOMContentLoaded", () => { if (window.renderIcons) window.renderIcons(); });
  </script>

</body>
</html>
