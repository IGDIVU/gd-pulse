<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purav Login — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  .purav-login {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #1e3a8a 0%, #ea580c 100%);
    position: relative;
    overflow: hidden;
  }
  .purav-login::before {
    content: "";
    position: absolute;
    top: -50%; right: -20%;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.1), transparent 70%);
    border-radius: 50%;
  }
  .purav-login::after {
    content: "";
    position: absolute;
    bottom: -30%; left: -10%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    border-radius: 50%;
  }
  .purav-login-box {
    background: white;
    padding: 48px 40px;
    border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    width: 100%; max-width: 440px;
    position: relative;
    z-index: 2;
    animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .purav-logo {
    width: 80px; height: 80px;
    margin: 0 auto 20px;
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e3a8a, #ea580c);
    box-shadow: 0 10px 30px rgba(30,58,138,0.4);
  }
  .purav-logo svg { width: 42px; height: 42px; color: white; }
  .purav-login-box h2 {
    text-align: center; font-size: 26px;
    color: #1a1a1a; font-weight: 800;
    margin-bottom: 8px;
  }
  .purav-login-box .sub {
    text-align: center; color: #6b7280;
    font-size: 14px; margin-bottom: 30px;
  }
  .purav-login-box label {
    display: block; font-size: 13px; color: #4b5563;
    font-weight: 600; margin-bottom: 8px;
  }
  .purav-login-box input {
    width: 100%; padding: 14px 16px;
    margin-bottom: 18px;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    background: #f9fafb;
    color: #1a1a1a; font-size: 15px;
    outline: none;
    transition: all 0.3s;
  }
  .purav-login-box input:focus {
    border-color: #1e3a8a;
    background: white;
    box-shadow: 0 0 0 4px rgba(30,58,138,0.1);
  }
  .purav-login-box button {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #1e3a8a, #ea580c);
    color: white; border: none;
    border-radius: 12px;
    font-size: 16px; font-weight: 800;
    cursor: pointer;
    transition: all 0.35s;
    box-shadow: 0 8px 20px rgba(30,58,138,0.35);
    letter-spacing: 0.5px;
    margin-top: 5px;
  }
  .purav-login-box button:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(30,58,138,0.5);
  }
  .purav-error {
    color: #ef4444;
    text-align: center;
    margin-bottom: 18px;
    font-size: 13px;
    padding: 10px;
    background: rgba(239, 68, 68, 0.08);
    border-radius: 10px;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }
  .purav-login-box .back-link {
    text-align: center; display: block;
    margin-top: 20px; font-size: 13px;
    color: #6b7280; text-decoration: none;
    transition: color 0.3s;
  }
  .purav-login-box .back-link:hover { color: #1e3a8a; }
  .purav-hint {
    text-align: center; font-size: 12px;
    color: #9ca3af; margin-top: 20px;
    padding: 10px;
    background: #f9fafb;
    border-radius: 8px;
  }
  .purav-hint b { color: #1e3a8a; }
</style>
</head>
<body>

  <div class="purav-login">
    <div class="purav-login-box">
      <div class="purav-logo"><span data-icon="sand"></span></div>
      <h2>Purav Carting</h2>
      <p class="sub">Business Login — Transport & Material Supply</p>

      {% if error %}<div class="purav-error">{{ error }}</div>{% endif %}

      <form method="POST">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autocomplete="off">

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required autocomplete="off">

        <button type="submit">Login to Dashboard →</button>
      </form>

      <a href="/purav" class="back-link">← Back to Purav Work</a>

      <div class="purav-hint">
        Credentials: <b>PC</b> / <b>123</b>
      </div>
    </div>
  </div>

  <script src="/static/icons.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => { if (window.renderIcons) window.renderIcons(); });
  </script>

</body>
</html>
