<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Trip — Purav Carting</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  .pc-nav { background: linear-gradient(135deg, #1e3a8a 0%, #ea580c 100%); padding: 0 20px; display: flex; align-items: center; gap: 4px; overflow-x: auto; box-shadow: 0 4px 20px rgba(30,58,138,0.3); position: sticky; top: 70px; z-index: 90; white-space: nowrap; }
  .pc-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 14px 16px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border-bottom: 3px solid transparent; }
  .pc-nav a:hover, .pc-nav a.active { color: white; background: rgba(255,255,255,0.1); }
  .pc-nav a.active { border-bottom-color: white; }
  .pc-nav a [data-icon] { width: 15px; height: 15px; }

  .page-head { padding: 30px 40px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
  .page-head h1 { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -1px; display: flex; align-items: center; gap: 12px; }
  .page-head h1 [data-icon] { width: 32px; height: 32px; color: #1e3a8a; }

  .btn-pc { background: linear-gradient(135deg, #1e3a8a, #ea580c); color: white; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 8px 20px rgba(30,58,138,0.3); }
  .btn-pc [data-icon] { width: 16px; height: 16px; }

  .form-wrap { max-width: 1000px; margin: 0 auto 40px; padding: 0 40px; }
  .card { background: var(--card); border: 2px solid #1e3a8a; border-radius: 18px; padding: 32px; box-shadow: 0 15px 40px rgba(30,58,138,0.15); }
  .card h2 { font-size: 20px; font-weight: 800; margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }
  .card h2 [data-icon] { width: 22px; height: 22px; color: #1e3a8a; }

  .form-section-title { font-size: 12px; font-weight: 800; color: #1e3a8a; text-transform: uppercase; letter-spacing: 1.5px; margin: 22px 0 14px; padding-bottom: 8px; border-bottom: 2px solid rgba(30,58,138,0.15); }

  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 18px; }

  label { display: block; font-size: 12px; color: var(--text-dim); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select, textarea { width: 100%; padding: 12px 14px; margin: 0; border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
  input:focus, select:focus { border-color: #1e3a8a; }

  .calc-box { background: linear-gradient(135deg, rgba(30,58,138,0.08), rgba(234,88,12,0.08)); border: 2px dashed #1e3a8a; border-radius: 14px; padding: 20px; margin-top: 20px; }
  .calc-box .row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 15px; }
  .calc-box .row.cost .val { color: #ef4444; font-weight: 800; }
  .calc-box .row.big { border-top: 2px solid rgba(30,58,138,0.3); margin-top: 10px; padding-top: 14px; font-size: 22px; font-weight: 900; }
  .calc-box .row.big .val { color: #10b981; }
  .calc-box .val { font-weight: 800; }

  .form-actions { display: flex; gap: 12px; margin-top: 24px; }
  .form-actions button, .form-actions a { flex: 1; padding: 15px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; border: none; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .form-actions .btn-cancel { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
  .form-actions .btn-save { background: linear-gradient(135deg, #1e3a8a, #ea580c); color: white; box-shadow: 0 8px 20px rgba(30,58,138,0.3); }

  @media (max-width: 700px) {
    .page-head, .form-wrap { padding-left: 20px; padding-right: 20px; }
    .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links"><a href="/purav/carting" class="active">Purav Carting</a></nav>
    <div class="header-right">
      <button class="theme-toggle" onclick="toggleTheme(event)"></button>
      <a href="#" onclick="confirmLogout(event)" class="avatar" title="{{ name }}">{{ name[0]|upper }}</a>
    </div>
  </header>

  <nav class="pc-nav">
    <a href="/purav/carting"><span data-icon="grid"></span> Dashboard</a>
    <a href="/purav/carting/trip" class="active"><span data-icon="sand"></span> New Trip</a>
    <a href="/purav/carting/trip/list"><span data-icon="analytics"></span> Trip List</a>
    <a href="/purav/carting/ledger"><span data-icon="analytics"></span> Ledger</a>
  </nav>

  <div class="page-head">
    <h1><span data-icon="sand"></span> New Trip (Detailed)</h1>
    <a href="/purav/carting/trip/list" class="btn-pc"><span data-icon="grid"></span> All Trips</a>
  </div>

  <div class="form-wrap">
    <div class="card">
      <h2><span data-icon="sand"></span> Trip Entry — Full Costing</h2>
      <form method="POST" action="/purav/carting/trip/add">
        <div class="form-grid-3">
          <div><label>Date *</label><input type="date" name="date" value="{{ today }}" required></div>
          <div>
            <label>Truck *</label>
            <select name="truck_id" required>
              <option value="">-- Select --</option>
              {% for t in trucks %}<option value="{{ t.id }}">{{ t.number }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label>Customer *</label>
            <select name="customer_id" required>
              <option value="">-- Select --</option>
              {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </select>
          </div>
        </div>

        <div class="form-section-title">Material & Sale</div>
        <div class="form-grid-3">
          <div>
            <label>Material *</label>
            <select name="material_id" id="t_material" required onchange="calcTotals()">
              <option value="">-- Select --</option>
              {% for m in materials %}<option value="{{ m.id }}" data-rate="{{ m.default_rate }}">{{ m.name }} ({{ m.unit }})</option>{% endfor %}
            </select>
          </div>
          <div><label>Quantity *</label><input type="number" name="quantity" id="t_qty" value="0" step="0.01" min="0" oninput="calcTotals()" required></div>
          <div><label>Rate (₹) *</label><input type="number" name="rate" id="t_rate" value="0" step="0.01" min="0" oninput="calcTotals()" required></div>
        </div>

        <div class="form-section-title">Cost Breakdown</div>
        <div class="form-grid-3">
          <div><label>Diesel (₹)</label><input type="number" name="diesel" id="t_diesel" value="0" step="0.01" min="0" oninput="calcTotals()"></div>
          <div><label>Labour (₹)</label><input type="number" name="labour" id="t_labour" value="0" step="0.01" min="0" oninput="calcTotals()"></div>
          <div><label>Driver (₹)</label><input type="number" name="driver" id="t_driver" value="0" step="0.01" min="0" oninput="calcTotals()"></div>
        </div>
        <div class="form-grid-3">
          <div><label>Maintenance (₹)</label><input type="number" name="maintenance" id="t_maint" value="0" step="0.01" min="0" oninput="calcTotals()"></div>
          <div><label>Other (₹)</label><input type="number" name="other" id="t_other" value="0" step="0.01" min="0" oninput="calcTotals()"></div>
          <div><label>Distance (KM)</label><input type="number" name="distance" value="0" step="0.1" min="0"></div>
        </div>

        <div class="form-grid-2">
          <div><label>Route</label><input type="text" name="route" placeholder="River → Godown → Site"></div>
          <div><label>Notes</label><input type="text" name="notes" placeholder="Optional"></div>
        </div>

        <div class="calc-box">
          <div class="row"><span>Sale Amount</span><span class="val" id="c_sale">₹0</span></div>
          <div class="row cost"><span>Total Cost</span><span class="val" id="c_cost">₹0</span></div>
          <div class="row big"><span>Trip Profit</span><span class="val" id="c_profit">₹0</span></div>
          <div class="row"><span>Profit %</span><span class="val" id="c_pct">0%</span></div>
        </div>

        <div class="form-actions">
          <a href="/purav/carting" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-save"><span data-icon="check"></span> Save Trip</button>
        </div>
      </form>
    </div>
  </div>

  <footer><p>© 2025 GD Pulse — Purav Carting</p></footer>

  <script src="/static/icons.js"></script>
  <script>
    document.getElementById("t_material").addEventListener("change", function() {
      const r = this.options[this.selectedIndex].getAttribute("data-rate");
      if (r && r !== "0" && r !== "0.0") document.getElementById("t_rate").value = r;
      calcTotals();
    });
    function calcTotals() {
      const qty = parseFloat(document.getElementById("t_qty").value) || 0;
      const rate = parseFloat(document.getElementById("t_rate").value) || 0;
      const diesel = parseFloat(document.getElementById("t_diesel").value) || 0;
      const labour = parseFloat(document.getElementById("t_labour").value) || 0;
      const driver = parseFloat(document.getElementById("t_driver").value) || 0;
      const maint = parseFloat(document.getElementById("t_maint").value) || 0;
      const other = parseFloat(document.getElementById("t_other").value) || 0;
      const sale = qty * rate;
      const cost = diesel + labour + driver + maint + other;
      const profit = sale - cost;
      const pct = sale > 0 ? (profit / sale) * 100 : 0;
      document.getElementById("c_sale").innerText = "₹" + sale.toLocaleString("en-IN", {maximumFractionDigits: 0});
      document.getElementById("c_cost").innerText = "₹" + cost.toLocaleString("en-IN", {maximumFractionDigits: 0});
      document.getElementById("c_profit").innerText = "₹" + profit.toLocaleString("en-IN", {maximumFractionDigits: 0});
      document.getElementById("c_profit").style.color = profit >= 0 ? "#10b981" : "#ef4444";
      document.getElementById("c_pct").innerText = pct.toFixed(1) + "%";
    }
    document.addEventListener("DOMContentLoaded", () => { if (window.renderIcons) window.renderIcons(); calcTotals(); });
  </script>

</body>
</html>
