<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — GD Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #1e2a38, #00b894);
    height: 100vh; display: flex; justify-content: center; align-items: center;
  }
  .login-box {
    background: white; padding: 40px 35px; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 340px;
  }
  .login-box h2 { text-align: center; color: #1e2a38; margin-bottom: 25px; }
  .login-box input {
    width: 100%; padding: 12px; margin-bottom: 15px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
  }
  .login-box input:focus { outline: none; border-color: #00b894; }
  .login-box button {
    width: 100%; padding: 12px; background: #00b894; color: white;
    border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
  }
  .login-box button:hover { background: #019875; }
  .error { color: #e74c3c; text-align: center; margin-bottom: 15px; font-size: 13px; }
  .back { text-align: center; margin-top: 15px; font-size: 13px; }
  .back a { color: #1e2a38; text-decoration: none; }
</style>
</head>
<body>

  <div class="login-box">
    <h2>🔐 Login</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div class="back"><a href="/">← Back to Dashboard</a></div>
  </div>

</body>
</html>
