<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor — GD Pulse</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo"><img src="/static/logo-horizontal.png" alt="GD Pulse"></a>
    <nav class="nav-links"><a href="/tools">Tools</a></nav>
    <div class="header-right">
      <a href="/tools" class="btn btn-outline">← Back</a>
    </div>
  </header>

  <main>
    <div class="container" style="max-width: 600px;">
      <div class="box">
        <h2>🎨 Image ka Size Kam Karo</h2>

        <form id="compressForm" method="POST" action="/tools/image-compress/process" enctype="multipart/form-data">
          <label>Image Select Karo</label>
          <input type="file" name="image" accept="image/*" required>

          <label>Quality: <span id="qval" style="color: var(--primary); font-weight: 700;">70</span>%</label>
          <input type="range" name="quality" min="10" max="100" value="70" id="qualityRange"
                 oninput="document.getElementById('qval').innerText = this.value">

          <div class="info">Kam quality = chhoti file, lekin image blur ho sakti hai. 60-80% best hai.</div>

          <button type="submit" class="calc-btn" id="submitBtn" style="margin-top: 15px;">Compress & Download</button>
        </form>

        <div class="loading" id="loading">⏳ Compressing... please wait</div>

        <a href="/tools" class="back">← Back to Tools</a>
      </div>
    </div>
  </main>

  <footer><p>© 2025 GD Pulse</p></footer>

  <script>
    document.getElementById("compressForm").addEventListener("submit", function() {
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").innerText = "Processing...";
      document.getElementById("loading").style.display = "block";
    });
  </script>

</body>
</html>
